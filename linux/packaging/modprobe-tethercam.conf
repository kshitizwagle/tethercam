# Tethercam's virtual camera. exclusive_caps=1 makes Chromium/WebRTC list it as a webcam; the agent
# finds the device by its "Tethercam" label. If you already use v4l2loopback for something else (e.g.
# OBS's virtual camera), add a second device instead: devices=2 card_label=Tethercam,OBS exclusive_caps=1,1
options v4l2loopback devices=1 card_label=Tethercam exclusive_caps=1
