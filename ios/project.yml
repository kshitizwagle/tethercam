name: Tethercam
options:
  bundleIdPrefix: org.tethercam
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    # Swift 5 language mode with strict-concurrency warnings; moving to Swift 6 mode is an M8 item.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your own team locally; never commit it
    TARGETED_DEVICE_FAMILY: "1,2"
    # Monocypher (vendored C, Wi-Fi transport crypto) reaches Swift through the bridging header.
    HEADER_SEARCH_PATHS: $(SRCROOT)/../third_party/monocypher
targets:
  Tethercam:
    type: application
    platform: iOS
    sources:
      - Tethercam
      - path: ../third_party/monocypher
        excludes: ["*.md"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tethercam.app
        SWIFT_OBJC_BRIDGING_HEADER: Tethercam/Tethercam-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Tethercam/Info.plist
      properties:
        CFBundleDisplayName: Tethercam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Tethercam streams your camera to your PC over the USB cable, or over Wi-Fi to PCs you paired.
        NSLocalNetworkUsageDescription: With Wireless on, Tethercam lets PCs you paired over USB find your iPhone and receive its camera over Wi-Fi.
        NSBonjourServices: [_tethercam._tcp]
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Portrait-only UI like the Camera app; icons rotate instead, and capture follows the phone.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
  TethercamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TethercamTests
      - path: ../docs/protocol-vectors/v1.txt
        buildPhase: resources
    dependencies:
      - target: Tethercam
schemes:
  Tethercam:
    build:
      targets:
        Tethercam: all
        TethercamTests: [test]
    test:
      targets: [TethercamTests]
