name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
  ios:
    uses: ./.github/workflows/ios.yml
  publish:
    needs: [windows, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect files and checksums
        run: |
          mkdir out
          cp dist/tethercam-windows/Tethercam-*.msi out/
          cp dist/tethercam-ios/Tethercam-unsigned.ipa out/
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "Tethercam $GITHUB_REF_NAME" --prerelease \
            --notes "Windows: install the MSI (needs Windows 11 and the Apple Devices app). iPhone: sideload Tethercam-unsigned.ipa with Sideloadly or AltStore (signs it with your Apple ID). See README for details."
