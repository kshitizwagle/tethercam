name: ios

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen
      - name: Test (simulator)
        working-directory: ios
        run: >
          xcodebuild -project Tethercam.xcodeproj -scheme Tethercam
          -destination "platform=iOS Simulator,name=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')"
          CODE_SIGNING_ALLOWED=NO test
      - name: Build unsigned IPA for sideloading
        working-directory: ios
        run: |
          xcodebuild -project Tethercam.xcodeproj -scheme Tethercam -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION=${{ inputs.version }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Tethercam.app Payload/
          # Ad-hoc sign with an (empty) entitlements blob: AltStore reads the existing signature's
          # entitlements before re-signing with the user's Apple ID and rejects a fully unsigned binary
          # ("The data couldn't be read because it isn't in the correct format").
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict/></plist>' > adhoc.entitlements
          codesign --force --sign - --entitlements adhoc.entitlements --timestamp=none Payload/Tethercam.app
          codesign -d --entitlements :- Payload/Tethercam.app
          zip -qry Tethercam-unsigned.ipa Payload
          ls -l Tethercam-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: tethercam-ios
          path: ios/Tethercam-unsigned.ipa
