name: ios

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen
      - name: Test (simulator)
        working-directory: ios
        run: >
          xcodebuild -project Tethercam.xcodeproj -scheme Tethercam
          -destination "platform=iOS Simulator,name=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')"
          CODE_SIGNING_ALLOWED=NO test
      - name: Build unsigned IPA for sideloading
        working-directory: ios
        run: |
          xcodebuild -project Tethercam.xcodeproj -scheme Tethercam -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION=${{ inputs.version }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Tethercam.app Payload/
          zip -qry Tethercam-unsigned.ipa Payload
          ls -l Tethercam-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: tethercam-ios
          path: ios/Tethercam-unsigned.ipa
